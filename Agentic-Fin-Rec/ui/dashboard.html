<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard · Finance Reconciliation Agent</title>
  <link rel="icon" type="image/svg+xml" href="assets/American_Express/Registered Trademark Left.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/placeholder.css">
</head>
<body class="placeholder">
  <header class="placeholder__header">
    <img class="placeholder__logo" src="assets/American_Express/AXP_Logotype.png" alt="American Express" width="282" height="18">
    <span class="placeholder__product">Finance Reconciliation Agent</span>
  </header>

  <main class="card placeholder__card">
    <img class="placeholder__banner" src="assets/American_Express/GettyImages.jpeg" alt="" width="820" height="312">
    <div class="placeholder__content">
      <span class="badge">Placeholder · Issue 5</span>
      <h1 class="placeholder__title">Welcome back, <span id="user-name">there</span></h1>
      <p class="placeholder__body">
        The reconciliation dashboard will live here. You were routed here because
        this account has already completed onboarding.
      </p>
      <div class="placeholder__actions">
        <a class="btn btn--primary" href="daily-review.html">Daily review</a>
        <button class="btn btn--secondary" id="sign-out" type="button">Sign out</button>
        <button class="btn btn--ghost" id="reset" type="button">Reset onboarding &amp; sign out</button>
      </div>
    </div>
  </main>

  <script src="assets/js/auth.js"></script>
  <script>
    (function () {
      const Auth = window.FinRecAuth;
      const session = Auth.requireSession();
      if (!session) return;

      document.getElementById('user-name').textContent = session.user.name.split(' ')[0];

      // Reaching the dashboard (via "Finish setup" or "Skip setup") ends onboarding,
      // so the login sends this user straight here next time.
      Auth.completeOnboarding(session.user);

      document.getElementById('sign-out').addEventListener('click', function () {
        Auth.signOut();
        window.location.assign(Auth.routes.signIn);
      });

      document.getElementById('reset').addEventListener('click', function () {
        Auth.resetOnboarding(session.user);
        Auth.signOut();
        window.location.assign(Auth.routes.signIn);
      });
    })();
  </script>
</body>
</html>
